[project]
name = "korfbal-deps"
version = "0.0.0"
requires-python = ">=3.12"
dependencies = [
    "django>=6.1.1,<6.2",
    "asgiref>=3.12.1,<4",
    "psycopg[binary,pool]>=3.3.6",
    "bg-audit-events",
    "bg-django-mobile-detector",
    "django-ratelimit",
    "django-storages[boto3]",
    "bg-auth",
    "bg-uuidv7",
    "django-phonenumber-field[phonenumberslite]",
    "python-dotenv",
    "django_crontab",
    "valkey",
    "django-valkey",
    "celery",
    "djangorestframework",
    "django-cors-headers",
    "channels",
    "channels-redis",
    "django-redis",
    "django-prometheus==2.6.0.dev22",
    "drf-spectacular",
    "qrcode>=8.2,<9",
    "reportlab>=5.0.1,<6",
    "pywebpush",
    "requests",
    # Live Activity pushes go straight to APNs (HTTP/2 + ES256 provider tokens).
    "httpx[http2]",
    "pyjwt[crypto]>=2.15.1",
    # Errors, tracing and profiling; stays inactive until SENTRY_DSN is set.
    "sentry-sdk>=2.40,<3",
]

[dependency-groups]
# Audio downloads run in Celery alongside ffmpeg, not in web/collectstatic.
worker = ["yt-dlp[default]>=2026.8.19"]

uwsgi = [
    "Pillow",
    "granian>=2.8.3,<3",
    "bg-django-caching-paginator",
    "django-cryptography",
]

# Local development exercises the same web and worker dependencies.
dev = [{ include-group = "uwsgi" }, { include-group = "worker" }]

# Standalone batch/controller images export these groups from this lock.
forecast = ["numpy==2.5.3", "scipy==1.18.1"]
controller = ["boto3>=1.43.105"]

[tool.uv]
environments = ["platform_python_implementation == 'CPython'"]

[tool.uv.sources]
bg-audit-events = { path = "../../../../libs/shared_python_packages/bg_audit_events", editable = true }
bg-auth = { path = "../../../../libs/django_packages/bg_auth", editable = true }
bg-django-caching-paginator = { path = "../../../../libs/django_packages/bg_django_caching_paginator", editable = true }
bg-django-mobile-detector = { path = "../../../../libs/django_packages/bg_django_mobile_detector", editable = true }
bg-uuidv7 = { path = "../../../../libs/shared_python_packages/bg_uuidv7", editable = true }
