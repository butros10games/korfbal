[project]
name = "KWT"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "django>=6.1,<6.2",
    "psycopg[binary,pool]",
    "bg-django-mobile-detector",
    "bg-audit-events",
    "django-ratelimit",
    "django-storages[boto3]",
    "bg-auth",
    "bg-uuidv7",
    "django-phonenumber-field[phonenumbers]",
    "python-dotenv",
    "django_crontab",
    "valkey",
    "django-valkey",
    "celery",
    "djangorestframework",
    "django-cors-headers",
    "channels",
    "channels-redis",
    "drf-spectacular",
    "qrcode>=8.2,<9",
    "reportlab>=4.4,<5",
    "pywebpush",
    "spotdl",
]

[dependency-groups]
uwsgi = [
    "Pillow",
    "pyuwsgi",
    "bg-django-caching-paginator",
    "django-cryptography",
    "django-prometheus==2.6.0.dev4",
]
dev = [
    "Pillow",
    "pyuwsgi; sys_platform == 'linux'",
    "bg-django-caching-paginator",
    "django-cryptography",
    "django-prometheus==2.6.0.dev4",
]

[tool.uv.sources]
bg-auth = { workspace = true }
bg-audit-events = { workspace = true }
bg-django-caching-paginator = { workspace = true }
bg-django-mobile-detector = { workspace = true }
bg-uuidv7 = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build]
packages = ["korfbal", "apps"]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "korfbal.settings_test"
python_files = ["test_*.py"]
pythonpath = ["."]
asyncio_default_fixture_loop_scope = "function"
markers = [
    "migration_regression: test that exercises Django's historical migration graph",
    "slow_migration: historical-state migration regression scheduled before faster tests",
]
