[project]
name = "KWT"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "django>=6.1,<6.2",
    "psycopg[binary,pool]",
    "bg-django-mobile-detector",
    "bg-audit-events",
    "django-ratelimit",
    "django-storages[boto3]",
    "bg-auth",
    "bg-uuidv7",
    "django-phonenumber-field[phonenumbers]",
    "python-dotenv",
    "django_crontab",
    "valkey",
    "django-valkey",
    "celery",
    "djangorestframework",
    "django-cors-headers",
    "channels",
    "channels-redis",
    "django-redis",
    "django-prometheus==2.6.0.dev4",
    "drf-spectacular",
    "qrcode>=8.2,<9",
    "reportlab>=5.0.1,<6",
    "pywebpush",
    "requests",
    "yt-dlp[default]>=2026.8.19",
]

[dependency-groups]
uwsgi = [
    "Pillow",
    "pyuwsgi",
    "bg-django-caching-paginator",
    "django-cryptography",
]
dev = [
    "Pillow",
    "pyuwsgi; sys_platform == 'linux'",
    "bg-django-caching-paginator",
    "django-cryptography",
]

[tool.uv.sources]
bg-auth = { workspace = true }
bg-audit-events = { workspace = true }
bg-django-caching-paginator = { workspace = true }
bg-django-mobile-detector = { workspace = true }
bg-uuidv7 = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build]
packages = ["korfbal", "apps"]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "korfbal.settings_test"
python_files = ["test_*.py"]
pythonpath = ["."]
norecursedirs = ["mutants", ".*", "node_modules", "build", "dist"]
asyncio_default_fixture_loop_scope = "function"
markers = [
    "migration_regression: test that exercises Django's historical migration graph",
    "slow_migration: historical-state migration regression scheduled before faster tests",
]

# Run from this directory with `uv run --with mutmut==3.8.0 mutmut run --max-children 2`.
# Begin with pure rules; expand only_mutate and test selection together for services.
[tool.mutmut]
source_paths = ["apps/"]
only_mutate = ["apps/*/domain/*.py"]
do_not_mutate = ["*/tests/*", "*/migrations/*", "*/__init__.py"]
also_copy = ["korfbal/", "conftest.py"]
pytest_add_cli_args = ["--nomigrations", "-x", "-q"]
pytest_add_cli_args_test_selection = [
    "apps/game_tracker/tests/test_domain_rules.py",
    "apps/game_tracker/tests/test_audit_domain_boundaries.py",
    "apps/game_tracker/tests/test_win_probability.py",
    "apps/game_tracker/tests/test_impact_results.py",
    "apps/game_tracker/tests/test_impact_scoring_v7.py",
    "apps/game_tracker/tests/test_impact_scoring_v8.py",
    "apps/competition/tests/test_match_timing.py",
    "apps/competition/tests/test_allocations.py",
    "apps/competition/tests/test_classification.py",
    "apps/competition/tests/test_ratings.py",
    "apps/competition/tests/test_rating_preview.py",
    "apps/audit/tests/test_api.py",
    "apps/audit/tests/test_producer_health.py",
]
