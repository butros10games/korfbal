# Docker keeps json-file logs forever by default; cap them so the host disk survives
# busy matches. The log collector reads them through the Docker API.
x-logging: &default-logging
    driver: json-file
    options:
        max-size: 20m
        max-file: '5'

services:
    kwt-uwsgi:
        logging: *default-logging
        image: butros10/kwt-uwsgi:latest
        container_name: kwt-uwsgi
        ports:
            - '1664:1664'
            - '1665:1665'
            - '1666:1666'
            - '1667:1667'
        env_file:
            - .env
        environment:
            DJANGO_ENV: production
            DEBUG: 'false'
            KORFBAL_PUBLIC_WORKERS: ${KORFBAL_PUBLIC_WORKERS:-2}
            KORFBAL_LIVE_READ_WORKERS: ${KORFBAL_LIVE_READ_WORKERS:-2}
            KORFBAL_LIVE_READ_THREADS: ${KORFBAL_LIVE_READ_THREADS:-2}
            KORFBAL_LIVE_READ_BACKPRESSURE: ${KORFBAL_LIVE_READ_BACKPRESSURE:-16384}
            KORFBAL_PUBLIC_THREADS: ${KORFBAL_PUBLIC_THREADS:-2}
            KORFBAL_PUBLIC_BACKPRESSURE: ${KORFBAL_PUBLIC_BACKPRESSURE:-16384}
            KORFBAL_SSE_WORKERS: ${KORFBAL_SSE_WORKERS:-2}
            KORFBAL_SSE_BACKPRESSURE: ${KORFBAL_SSE_BACKPRESSURE:-8192}
            KORFBAL_DB_POOL_MAX_SIZE: ${KORFBAL_WEB_DB_POOL_MAX_SIZE:-8}
            VIDEO_ANALYSIS_ROOT: /var/lib/korfbal/video-analysis
            VIDEO_ANALYSIS_TRAINING_POLICY: /run/korfbal/training-policy.json
            BG_AUTH_PASSKEY_RP_ID: korfbal.butrosgroot.com
            # korfconnect.nl uses the original RP ID through /.well-known/webauthn.
            BG_AUTH_PASSKEY_ORIGINS: https://korfbal.butrosgroot.com,https://korfconnect.nl
        restart: unless-stopped
        volumes:
            - video-analysis:/var/lib/korfbal/video-analysis
            - ${KORFBAL_TRAINING_POLICY_FILE:-./training-policy.json}:/run/korfbal/training-policy.json:ro
        networks:
            - kwt-net

    kwt-video-worker:
        logging: *default-logging
        image: butros10/kwt-celery:latest
        restart: unless-stopped
        env_file: [.env]
        environment:
            DJANGO_ENV: production
            DEBUG: 'false'
            VIDEO_ANALYSIS_ROOT: /var/lib/korfbal/video-analysis
            VIDEO_ANALYSIS_TRAINING_POLICY: /run/korfbal/training-policy.json
            CODEX_HOME: /home/appuser/.codex
            YOLO_CONFIG_DIR: /models/config
        entrypoint: [celery]
        command:
            [
                -A,
                korfbal,
                worker,
                --queues,
                vision,
                --concurrency,
                '1',
                --loglevel,
                info,
                --hostname,
                'vision@%h',
            ]
        working_dir: /models
        volumes:
            - video-analysis:/var/lib/korfbal/video-analysis
            - ${KORFBAL_TRAINING_POLICY_FILE:-./training-policy.json}:/run/korfbal/training-policy.json:ro
            - video-models:/models
            - video-codex:/home/appuser/.codex
        networks: [kwt-net]
        mem_limit: 4g
        cpus: 2

    kwt-web:
        logging: *default-logging
        image: butros10/kwt-web:latest
        container_name: kwt-web
        ports:
            - '4173:4173'
        environment:
            - CHOKIDAR_USEPOLLING=true
            - VITE_API_BASE_URL=https://api.korfbal.butrosgroot.com/api
            - VITE_GOOGLE_CAST_APP_ID=${VITE_GOOGLE_CAST_APP_ID:-C443FDD5}
            - VITE_USE_MOCK_API=false
            - VITE_MATCH_REALTIME_TRANSPORT=${VITE_MATCH_REALTIME_TRANSPORT:-sse}
        networks:
            - kwt-net

    kwt-valkey:
        logging: *default-logging
        image: valkey/valkey:latest
        container_name: kwt-valkey
        restart: unless-stopped
        networks:
            - kwt-net

    kwt-collectstatic:
        logging: *default-logging
        image: butros10/kwt-collectstatic:latest
        container_name: kwt-collectstatic
        env_file:
            - .env
        environment:
            DJANGO_ENV: production
            DEBUG: 'false'
        dns:
            - 8.8.8.8
            - 8.8.4.4
        networks:
            - kwt-net

    kwt-migrate:
        logging: *default-logging
        image: butros10/kwt-uwsgi:latest
        container_name: kwt-migrate
        command: python manage.py migrate
        env_file:
            - .env
        environment:
            DJANGO_ENV: production
            DEBUG: 'false'
        networks:
            - kwt-net

    kwt-celery_worker:
        logging: *default-logging
        stop_grace_period: 35m
        image: butros10/kwt-celery:latest
        container_name: kwt-celery_worker
        restart: unless-stopped
        dns:
            - 8.8.8.8
            - 8.8.4.4
        env_file:
            - .env
        environment:
            DJANGO_ENV: production
            DEBUG: 'false'
            KORFBAL_INSTANT_CONCURRENCY: ${KORFBAL_INSTANT_CONCURRENCY:-1}
        volumes:
            - sportlink-sessions:/run/sportlink
        networks:
            - kwt-net

    kwt-celery_beat:
        logging: *default-logging
        image: butros10/kwt-celery:latest
        container_name: kwt-celery_beat
        restart: unless-stopped
        env_file:
            - .env
        environment:
            DJANGO_ENV: production
            DEBUG: 'false'
        command: celery -A korfbal beat --loglevel=info --schedule=/tmp/celerybeat-schedule
        networks:
            - kwt-net

networks:
    kwt-net:
        driver: bridge

volumes:
    video-analysis:
    video-models:
    video-codex:
    sportlink-sessions:
